name: Temporary System B QQQ 5m real-data backtest

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Download pinned QQQ data loader
        run: curl -L --fail https://raw.githubusercontent.com/phoenixa108-lgtm/jasonwang.github.io/4782e8c336dd8a3ea57174650ca0a20b54729284/tmp_fvg_backtest.py -o tmp_fvg_engine.py
      - name: Patch conservative limit-fill sequencing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tmp_system_b_5m_backtest.py')
          s = p.read_text()
          s = s.replace(
              '    for i, (t, row) in enumerate(bars.iterrows()):\n        day = t.date()',
              '    for i, (t, row) in enumerate(bars.iterrows()):\n        position_filled_by_limit = False\n        day = t.date()'
          )
          s = s.replace(
              '                    position = new_position\n                    daily_trades += 1',
              '                    position = new_position\n                    position_filled_by_limit = True\n                    daily_trades += 1'
          )
          s = s.replace(
              '        if position is not None:\n            ex = evaluate_position_on_slice(position, raw_slice)\n            if ex is not None:',
              '        if position is not None and not position_filled_by_limit:\n            ex = evaluate_position_on_slice(position, raw_slice)\n            if ex is not None:'
          )
          p.write_text(s)
          PY
      - name: Run System B backtest
        run: python tmp_system_b_5m_backtest.py
      - name: Print outputs
        if: always()
        run: |
          echo '--- combined_metrics.csv ---'
          cat system_b_results/combined_metrics.csv || true
          echo '--- segment_metrics.csv ---'
          cat system_b_results/segment_metrics.csv || true
          echo '--- monte_carlo.csv ---'
          cat system_b_results/monte_carlo.csv || true
          echo '--- cost_sensitivity.csv ---'
          cat system_b_results/cost_sensitivity.csv || true
          echo '--- results.json ---'
          cat system_b_results/results.json || true
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-system-b-5m-realdata-results-v2
          path: system_b_results/
          if-no-files-found: warn
          retention-days: 2
