name: Temporary QQQ trend optimization v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Reconstruct and check optimizer
        run: |
          python tmp_trend_opt2_parts/reconstruct.py
          python -m py_compile tmp_qqq_trend_optimizer_v2.py
      - name: Download pinned market-data loader
        run: curl -L --fail https://raw.githubusercontent.com/phoenixa108-lgtm/jasonwang.github.io/4782e8c336dd8a3ea57174650ca0a20b54729284/tmp_fvg_backtest.py -o tmp_fvg_engine.py
      - name: Run robust parameter search
        run: python tmp_qqq_trend_optimizer_v2.py
      - name: Print key outputs
        if: always()
        run: |
          cat trend_opt2_results/report.json || true
          cat trend_opt2_results/holdout_metrics.csv || true
          cat trend_opt2_results/selected_segment_metrics.csv || true
          cat trend_opt2_results/cost_sensitivity.csv || true
      - name: Upload optimization results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qqq-trend-opt2-results
          path: trend_opt2_results/
          if-no-files-found: warn
          retention-days: 2
